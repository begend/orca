# Personal-branch macOS build: uploads unsigned dmg/zip as run artifacts instead of
# publishing to a dev channel. No signing identity, no notarization, no orcad template.
name: macOS artifact build

on:
  push:
    branches: [feat/ssh-host-password]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # Unset dev build identity so official stable/rc telemetry stays silent.
      ORCA_DIAGNOSTICS_TOKEN_URL: https://www.onorca.dev/diagnostics/token
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-macos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-macos-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - name: Install mobile workspace dependencies
        uses: ./.github/actions/install-mobile-dependencies

      - name: Build macOS native helpers
        run: |
          pnpm build:computer-macos
          pnpm build:keyboard-layout-macos
          pnpm build:notification-status-macos

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Build WSL guest
        run: pnpm run build:wsl-guest

      - name: Build native helpers
        run: pnpm run build:native

      - name: Verify computer native
        run: pnpm run verify:computer-native

      - name: Build CLI
        run: pnpm run build:cli

      - name: Build electron-vite bundles
        run: pnpm run build:electron-vite

      - name: Verify built skills CLI
        run: pnpm run verify:built-skills-cli

      - name: Project web client from renderer build
        run: pnpm run build:web-from-renderer

      - name: Build mobile web bundle
        run: pnpm run build:mobile-web

      - name: Package macOS dmg and zip
        run: |
          pnpm ensure:electron-runtime
          pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --publish never
        env:
          ORCA_BUILD_COMMIT: ${{ github.sha }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: orca-macos-packages
          path: |
            dist/orca-macos-*.dmg
            dist/orca-macos-*.zip
          if-no-files-found: error
          retention-days: 14
