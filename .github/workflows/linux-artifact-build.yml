# Personal-branch Linux package build: uploads AppImage/deb/rpm as run artifacts instead of
# publishing to a channel. No signing, no dev-channel identity, no orcad template.
name: Linux artifact build

on:
  push:
    branches: [feat/ssh-host-password]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Unset dev build identity so official stable/rc telemetry stays silent.
      ORCA_DIAGNOSTICS_TOKEN_URL: https://www.onorca.dev/diagnostics/token
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-linux-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-linux-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - name: Install mobile workspace dependencies
        uses: ./.github/actions/install-mobile-dependencies

      - name: Install Linux package tooling
        run: |
          timeout 120 sudo apt-get update || true
          # atspi/python3-gi back verify:computer-native's Linux provider import check.
          timeout 300 sudo apt-get install -y cpio rpm python3-gi gir1.2-atspi-2.0 at-spi2-core

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Build WSL guest
        run: pnpm run build:wsl-guest

      - name: Build native helpers
        run: pnpm run build:native

      - name: Verify computer native
        run: pnpm run verify:computer-native

      - name: Build CLI
        run: pnpm run build:cli

      - name: Build electron-vite bundles
        run: pnpm run build:electron-vite

      - name: Verify built skills CLI
        run: pnpm run verify:built-skills-cli

      - name: Project web client from renderer build
        run: pnpm run build:web-from-renderer

      - name: Build mobile web bundle
        run: pnpm run build:mobile-web
        env:
          # Unset dev build identity so official stable/rc telemetry stays silent.
          ORCA_DIAGNOSTICS_TOKEN_URL: https://www.onorca.dev/diagnostics/token

      - name: Package Linux AppImage, deb, and rpm
        run: |
          set -o pipefail
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.config.cjs --linux AppImage deb rpm --x64 --publish never 2>&1 | tee /tmp/linux-package.log || {
            echo '## linux package failure tail' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -c 5000 /tmp/linux-package.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
        env:
          ORCA_BUILD_COMMIT: ${{ github.sha }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: orca-linux-packages
          path: |
            dist/orca-linux.AppImage
            dist/orca-ide_*.deb
            dist/orca-ide-*.rpm
          if-no-files-found: error
          retention-days: 14
